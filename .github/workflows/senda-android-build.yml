name: Compilar base Android SENDA
on:
  push:
    branches: [senda-apk-build-20261028]
    paths-ignore: ['built/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Verificar APK
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: SENDA-base
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar base compilada en rama
        run: |
          mkdir -p built
          cp app/build/outputs/apk/debug/app-debug.apk built/SENDA-base.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add built/SENDA-base.apk
          git commit -m "Android base APK compiled" || true
          git push
